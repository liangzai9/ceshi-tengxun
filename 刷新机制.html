<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯IM在线人数查询与数据统计</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 100px;
            padding-bottom: 40px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .floating-btn-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .fetch-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .fetch-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .fetch-btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        .fetch-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .loading {
            display: none;
            margin: 20px 0;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .data-container {
            margin-top: 20px;
            text-align: left;
        }
        
        .data-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .data-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .data-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item-index {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        
        .item-content {
            flex-grow: 1;
            margin-left: 15px;
        }
        
        .item-value {
            font-size: 22px;
            font-weight: 600;
            color: #333;
        }
        
        .item-time {
            font-size: 12px;
            color: #999;
            text-align: right;
            min-width: 120px;
        }
        
        .input-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-title {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .input-box {
            flex: 1;
            min-width: 60px;
            max-width: 80px;
        }
        
        .input-box input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .input-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .input-box input:read-only {
            background-color: #f7fafc;
            color: #4a5568;
        }
        
        .input-label {
            font-size: 12px;
            color: #718096;
            text-align: center;
            margin-top: 5px;
        }
        
        .stats-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        
        .stats-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .stats-column {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .stats-column-title {
            font-size: 16px;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        
        .digit-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        
        .digit-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 5px;
            border-radius: 6px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        .digit-item.highlight {
            background: #fff5f5;
            border: 2px solid #fc8181;
            color: #c53030;
            font-weight: bold;
            transform: scale(1.05);
        }
        
        .digit-number {
            font-size: 24px;
            font-weight: 700;
            color: #4a5568;
            margin-bottom: 5px;
        }
        
        .digit-item.highlight .digit-number {
            color: #c53030;
        }
        
        .digit-count {
            font-size: 12px;
            color: #718096;
        }
        
        .digit-item.highlight .digit-count {
            color: #c53030;
            font-weight: 600;
        }
        
        .error-message {
            background: #fff5f5;
            border-left: 4px solid #f56565;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .error-message.active {
            display: block;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .bottom-inputs-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .bottom-input {
            width: 100px;
            height: 30px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            padding: 0;
            transition: all 0.3s ease;
        }
        
        .bottom-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .bottom-input.left {
            margin-right: auto;
        }
        
        .bottom-input.right {
            margin-left: auto;
        }
        
        @media (max-width: 768px) {
            body {
                padding-top: 80px;
            }
            .fetch-btn {
                padding: 12px 30px;
                font-size: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .digit-stats {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="floating-btn-container">
        <button class="fetch-btn" id="fetchBtn">获取在线人数数据</button>
    </div>

    <div class="container">
        <h1>腾讯IM在线人数查询与数据统计</h1>
        <p class="subtitle">点击悬浮按钮获取数据，自动分析数字出现频率</p>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #666;">正在获取数据，请稍候...</p>
        </div>
        
        <div class="error-message" id="errorMessage">
            <div class="error-title">获取数据失败</div>
            <div class="error-detail" id="errorDetail"></div>
        </div>
        
        <div class="data-container" id="dataContainer">
            <div class="data-title">在线人数数据</div>
            <div class="data-list" id="dataList">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📊</div>
                    <div class="empty-text">暂无数据，请点击上方悬浮按钮获取</div>
                </div>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <div class="input-title">第一组输入框（前两位数据）</div>
                    <div class="input-container" id="firstGroupInputs"></div>
                </div>
                <div class="input-group">
                    <div class="input-title">第二组输入框（后两位数据）</div>
                    <div class="input-container" id="secondGroupInputs"></div>
                </div>
            </div>

            <div class="stats-section" id="statsSection" style="display: none;">
                <div class="stats-title">数字出现次数统计（出现最少的两个数字标红）</div>
                <div class="stats-grid">
                    <div class="stats-column">
                        <div class="stats-column-title">第一组数字统计（前两位）</div>
                        <div class="digit-stats" id="firstGroupStats"></div>
                    </div>
                    <div class="stats-column">
                        <div class="stats-column-title">第二组数字统计（后两位）</div>
                        <div class="digit-stats" id="secondGroupStats"></div>
                    </div>
                </div>
                <div class="bottom-inputs-section">
                    <input type="text" class="bottom-input left" placeholder="">
                    <input type="text" class="bottom-input right" placeholder="">
                </div>
            </div>
        </div>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetchBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const errorDetail = document.getElementById('errorDetail');
        const dataList = document.getElementById('dataList');
        const emptyState = document.getElementById('emptyState');
        const firstGroupInputs = document.getElementById('firstGroupInputs');
        const secondGroupInputs = document.getElementById('secondGroupInputs');
        const statsSection = document.getElementById('statsSection');
        const firstGroupStats = document.getElementById('firstGroupStats');
        const secondGroupStats = document.getElementById('secondGroupStats');

        const proxyUrl = 'http://localhost:3000/get-data';

        function initInputBoxes() {
            firstGroupInputs.innerHTML = '';
            secondGroupInputs.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const firstBox = document.createElement('div');
                firstBox.className = 'input-box';
                firstBox.innerHTML = `
                    <input type="text" maxlength="2" readonly id="first-${i}">
                    <div class="input-label">#${i + 1}</div>
                `;
                firstGroupInputs.appendChild(firstBox);

                const secondBox = document.createElement('div');
                secondBox.className = 'input-box';
                secondBox.innerHTML = `
                    <input type="text" maxlength="2" readonly id="second-${i}">
                    <div class="input-label">#${i + 1}</div>
                `;
                secondGroupInputs.appendChild(secondBox);
            }
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        function generateFiveDigitCode(number) {
            const numStr = number.toString();
            let sum = 0;
            for (let i = 0; i < numStr.length; i++) {
                const digit = parseInt(numStr[i]);
                if (!isNaN(digit)) sum += digit;
            }
            const firstDigit = sum % 10;
            const lastFourDigits = numStr.slice(-4).padStart(4, '0');
            return `${firstDigit}${lastFourDigits}`;
        }

        function countDigitOccurrences(digits) {
            const counts = {};
            for (let i = 0; i <= 9; i++) counts[i] = 0;
            digits.forEach(digit => {
                const num = parseInt(digit);
                if (!isNaN(num) && num >= 0 && num <= 9) counts[num]++;
            });
            return counts;
        }

        function findLeastFrequent(counts) {
            const entries = Object.entries(counts).map(([digit, count]) => ({
                digit: parseInt(digit), count
            }));
            entries.sort((a, b) => a.count - b.count || a.digit - b.digit);
            return entries.slice(0, 2).map(item => item.digit);
        }

        function renderStats(firstGroupDigits, secondGroupDigits) {
            const firstCounts = countDigitOccurrences(firstGroupDigits);
            const firstLeast = findLeastFrequent(firstCounts);
            const secondCounts = countDigitOccurrences(secondGroupDigits);
            const secondLeast = findLeastFrequent(secondCounts);

            firstGroupStats.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const item = document.createElement('div');
                item.className = `digit-item ${firstLeast.includes(i) ? 'highlight' : ''}`;
                item.innerHTML = `<div class="digit-number">${i}</div><div class="digit-count">${firstCounts[i]}次</div>`;
                firstGroupStats.appendChild(item);
            }

            secondGroupStats.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                const item = document.createElement('div');
                item.className = `digit-item ${secondLeast.includes(i) ? 'highlight' : ''}`;
                item.innerHTML = `<div class="digit-number">${i}</div><div class="digit-count">${secondCounts[i]}次</div>`;
                secondGroupStats.appendChild(item);
            }
            statsSection.style.display = 'block';
        }

        function fillInputBoxesAndCollect(codes) {
            const firstGroupDigits = [];
            const secondGroupDigits = [];
            // 清空旧值
            for (let i = 0; i < 10; i++) {
                const f = document.getElementById(`first-${i}`);
                const s = document.getElementById(`second-${i}`);
                if (f) f.value = '';
                if (s) s.value = '';
            }
            codes.forEach((code, index) => {
                if (index < 10) {
                    const firstTwo = code.substring(0, 2);
                    const f = document.getElementById(`first-${index}`);
                    if (f) {
                        f.value = firstTwo;
                        firstGroupDigits.push(...firstTwo.split(''));
                    }
                    const lastTwo = code.substring(3, 5);
                    const s = document.getElementById(`second-${index}`);
                    if (s) {
                        s.value = lastTwo;
                        secondGroupDigits.push(...lastTwo.split(''));
                    }
                }
            });
            renderStats(firstGroupDigits, secondGroupDigits);
        }

        function renderData(data) {
            dataList.innerHTML = '';
            if (!data || data.length === 0) {
                emptyState.style.display = 'block';
                statsSection.style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            data.slice(0, 10).forEach((item, index) => {
                const dataItem = document.createElement('div');
                dataItem.className = 'data-item';
                dataItem.innerHTML = `
                    <div class="item-index">${index + 1}</div>
                    <div class="item-content">
                        <div class="item-label">在线人数</div>
                        <div class="item-value">${formatNumber(item.onlinenumber)}</div>
                    </div>
                    <div class="item-time">${item.onlinetime}</div>
                `;
                dataList.appendChild(dataItem);
            });
            const codes = data.slice(0, 10).map(item => generateFiveDigitCode(item.onlinenumber));
            fillInputBoxesAndCollect(codes);
        }

        // 关键：最简请求，不加参数、不加header
        async function fetchData() {
            fetchBtn.disabled = true;
            loading.classList.add('active');
            errorMessage.classList.remove('active');
            try {
                const response = await fetch(proxyUrl, {
                    method: 'GET',
                    cache: 'no-cache'
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();
                if (result.success) {
                    renderData(result.data);
                    fetchBtn.textContent = '刷新数据';
                } else {
                    throw new Error(result.message || '服务器错误');
                }
            } catch (error) {
                errorDetail.textContent = error.message;
                errorMessage.classList.add('active');
            } finally {
                fetchBtn.disabled = false;
                loading.classList.remove('active');
            }
        }

        fetchBtn.addEventListener('click', fetchData);
        document.addEventListener('DOMContentLoaded', initInputBoxes);
    </script>
</body>
</html>
